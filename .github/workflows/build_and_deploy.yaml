name: Deploy Snowpark Apps

# Controls when the action will run. 
on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Configure Snowflake CLI connection
        env:
          SNOWSQL_ACCOUNT: ${{ secrets.SNOWSQL_ACCOUNT }}
          SNOWSQL_USER: ${{ secrets.SNOWSQL_USER }}
          SNOWSQL_PWD: ${{ secrets.SNOWSQL_PWD }}
          SNOWSQL_ROLE: ${{ secrets.SNOWSQL_ROLE }}
          SNOWSQL_WAREHOUSE: ${{ secrets.SNOWSQL_WAREHOUSE }}
          SNOWSQL_DATABASE: ${{ secrets.SNOWSQL_DATABASE }}
        run: |
          mkdir -p "$HOME/.snowflake"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = {
              "account": os.environ["SNOWSQL_ACCOUNT"],
              "user": os.environ["SNOWSQL_USER"],
              "password": os.environ["SNOWSQL_PWD"],
              "role": os.environ["SNOWSQL_ROLE"],
              "warehouse": os.environ["SNOWSQL_WAREHOUSE"],
              "database": os.environ["SNOWSQL_DATABASE"],
              "schema": "ANALYTICS",
          }
          lines = ["[default]"]
          lines.extend(f"{key} = {json.dumps(value)}" for key, value in profile.items())
          path = Path.home() / ".snowflake" / "connections.toml"
          path.write_text("\n".join(lines) + "\n")
          path.chmod(0o600)
          PY

      - name: Deploy Snowpark apps
        run: python deploy_snowpark_apps.py $GITHUB_WORKSPACE
